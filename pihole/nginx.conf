map $status $loggable {
    ~^4  1;
    default 0;
}

# JSON access log для Loki + GeoIP (как в референсе NGINX/Loki)
log_format pihole_json escape=json
  '{'
    '"time_local":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_time":$request_time'
  '}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/pihole-access.log pihole_json;
    access_log /var/log/nginx/pihole-fail.log pihole_json if=$loggable;

    client_max_body_size 1m;

    location / {
        proxy_pass http://pihole:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://pihole:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
