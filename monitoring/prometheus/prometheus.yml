global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]


scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: routenode1

  - job_name: node
    static_configs:
      - targets: ["172.18.0.1:9100"]
        labels:
          host: routenode1


  - job_name: services
    scrape_timeout: 8s
    static_configs:
      - targets: ["service-exporter:9101"]
        labels:
          host: routenode1
