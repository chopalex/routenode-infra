services:
  vk-turn-proxy:
    build: .
    image: vk-turn-proxy:local
    container_name: vk-turn-proxy
    restart: unless-stopped
    # host network: вход через VK Calls на :56000; AWG в конфиге — localhost
    network_mode: host
    command: ["-listen", "0.0.0.0:56000", "-connect", "127.0.0.1:47054"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
